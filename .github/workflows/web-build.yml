name: Care Car web and desktop shell build

on:
  push:
    branches:
      - care-car-2-supabase-netlify
  pull_request:
    branches:
      - main

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Electron shell
        run: |
          node --check main.js
          node --check preload.js

      - name: Build web app
        run: npm run build:web
